[CLI]
# Match the revealjs decks: 16:9 at 1280x720. The stage is the course navy; the palette
# lives in scenes.py as constants. -qm is the deck quality; -ql for previews.
background_color = "#002f57"
pixel_width = 1280
pixel_height = 720
frame_rate = 30
format = mp4
# outside iCloud: renders inside ~/Desktop make git and quarto crawl.
# No inline comment here: configparser keeps it as part of the path.
media_dir = /Users/niccolo/.cache/sbd-manim-media
disable_caching = False
