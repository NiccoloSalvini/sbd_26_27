# The site is rendered locally (`make build`) and pushed with `make deploy`.
# No build command here on purpose: Netlify's image has no Quarto, and
# installing it on every build is a moving part this site does not need.
[build]
  publish = "_site"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
